name: Issue auto-drive

on:
  issues:
    types: [opened, reopened]
  pull_request_review:
    types: [submitted, edited, dismissed]
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      number:
        description: Issue or pull request number to continue
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: conahcnuj-${{ github.event_name == 'issues' && github.event.issue.number || github.event_name == 'pull_request_review' && github.event.pull_request.number || (github.event_name == 'workflow_run' && github.event.workflow_run.pull_requests[0].number) || inputs.number }}
  cancel-in-progress: true

jobs:
  drive:
    uses: nahcnuj/conahcnuj/.github/workflows/issue-driver.yml@ac5411eab527f02e9917cfc1e9654b78aafcf80d
    with:
      number: ${{ github.event_name == 'issues' && github.event.issue.number || github.event_name == 'pull_request_review' && github.event.pull_request.number || (github.event_name == 'workflow_run' && github.event.workflow_run.pull_requests[0].number) || inputs.number }}
    secrets: inherit
